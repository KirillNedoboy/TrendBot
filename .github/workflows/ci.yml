name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Restore locked dependencies
        run: dotnet restore TradingBot.slnx --locked-mode
      - name: Verify formatting
        run: dotnet format TradingBot.slnx --verify-no-changes
      - name: Build
        run: dotnet build TradingBot.slnx -c Release --no-restore --warnaserror
      - name: Test
        run: dotnet test TradingBot.slnx -c Release --no-build --no-restore
      - name: Validate documentation fixtures
        shell: pwsh
        run: ./tools/tests/validate-docs.Tests.ps1
      - name: Validate project memory
        shell: pwsh
        run: ./tools/validate-docs.ps1
